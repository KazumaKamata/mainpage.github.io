<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>返済額シミュレーター</title>
<meta name="description" content="信用金庫などのローンの毎月の返済額・総返済額・利息を計算するシミュレーター">
<style>
  :root {
    --bg: #f6f7f9;
    --card: #ffffff;
    --text: #1f2933;
    --muted: #616e7c;
    --border: #d9dee4;
    --accent: #0b6e4f;
    --accent-soft: #e3f2ec;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14181c;
      --card: #1d2329;
      --text: #e6e9ec;
      --muted: #9aa5b1;
      --border: #333c45;
      --accent: #4cc497;
      --accent-soft: #1c3a30;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
    line-height: 1.6;
  }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  p.lead { color: var(--muted); margin: 0 0 20px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 560px) { .grid { grid-template-columns: 1fr; } }
  label { display: block; font-weight: 600; font-size: .9rem; margin-bottom: 4px; }
  .field { display: flex; align-items: center; gap: 6px; }
  input, select {
    width: 100%;
    font: inherit;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
    color: var(--text);
  }
  .unit { color: var(--muted); white-space: nowrap; font-size: .9rem; }
  .result { background: var(--accent-soft); border-color: var(--accent); }
  .big { font-size: 2rem; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
  .sub { color: var(--muted); font-size: .85rem; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 12px; }
  @media (max-width: 560px) { .stats { grid-template-columns: 1fr; } }
  .stats div span { display: block; }
  .stats .v { font-weight: 700; font-variant-numeric: tabular-nums; }
  details summary { cursor: pointer; font-weight: 600; }
  .table-wrap { overflow-x: auto; margin-top: 12px; max-height: 420px; overflow-y: auto; }
  table { width: 100%; border-collapse: collapse; font-size: .85rem; font-variant-numeric: tabular-nums; }
  th, td { padding: 6px 8px; border-bottom: 1px solid var(--border); text-align: right; white-space: nowrap; }
  th { position: sticky; top: 0; background: var(--card); }
  .note { color: var(--muted); font-size: .8rem; }
</style>
</head>
<body>
<main>
  <h1>返済額シミュレーター</h1>
  <p class="lead">信用金庫などのローンについて、毎月の返済額を計算します。</p>

  <section class="card">
    <div class="grid">
      <div>
        <label for="principal">借入金額</label>
        <div class="field"><input id="principal" type="number" min="0" step="10000" value="3000000" inputmode="numeric"><span class="unit">円</span></div>
      </div>
      <div>
        <label for="rate">金利（年率）</label>
        <div class="field"><input id="rate" type="number" min="0" step="0.01" value="2.5" inputmode="decimal"><span class="unit">%</span></div>
      </div>
      <div>
        <label for="years">返済期間</label>
        <div class="field">
          <input id="years" type="number" min="0" step="1" value="10" inputmode="numeric"><span class="unit">年</span>
          <input id="months" type="number" min="0" max="11" step="1" value="0" inputmode="numeric"><span class="unit">ヶ月</span>
        </div>
      </div>
      <div>
        <label for="method">返済方式</label>
        <select id="method">
          <option value="annuity">元利均等返済（毎月の返済額が一定）</option>
          <option value="principal">元金均等返済（元金部分が一定）</option>
        </select>
      </div>
    </div>
  </section>

  <section class="card result" aria-live="polite">
    <div class="sub" id="label">毎月の返済額</div>
    <div class="big" id="monthly">—</div>
    <div class="sub" id="detail"></div>
    <div class="stats">
      <div><span class="sub">返済回数</span><span class="v" id="count">—</span></div>
      <div><span class="sub">利息総額</span><span class="v" id="interest">—</span></div>
      <div><span class="sub">総返済額</span><span class="v" id="total">—</span></div>
    </div>
  </section>

  <section class="card">
    <details>
      <summary>返済予定表を表示</summary>
      <div class="table-wrap">
        <table>
          <thead><tr><th>回</th><th>返済額</th><th>元金</th><th>利息</th><th>残高</th></tr></thead>
          <tbody id="schedule"></tbody>
        </table>
      </div>
    </details>
  </section>

  <p class="note">
    ※ 利息は「残高 × 年利 ÷ 12」で月ごとに計算し、1円未満は切り捨てています。最終回で端数を調整します。
    保証料・団体信用生命保険料・手数料などは含みません。実際の返済額は信用金庫の返済予定表でご確認ください。
  </p>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  const yen = (n) => Math.round(n).toLocaleString("ja-JP") + " 円";

  function buildSchedule(principal, annualRate, n, method) {
    const r = annualRate / 100 / 12;
    const rows = [];
    let balance = principal;
    let fixed;
    if (method === "annuity") {
      fixed = r === 0 ? principal / n : principal * r / (1 - Math.pow(1 + r, -n));
      fixed = Math.ceil(fixed);
    } else {
      fixed = Math.floor(principal / n);
    }
    for (let i = 1; i <= n; i++) {
      const interest = Math.floor(balance * r);
      let princ = method === "annuity" ? fixed - interest : fixed;
      if (i === n || princ > balance) princ = balance;
      balance -= princ;
      rows.push({ i, payment: princ + interest, princ, interest, balance });
    }
    return rows;
  }

  function render() {
    const principal = Math.max(0, Number($("principal").value) || 0);
    const rate = Math.max(0, Number($("rate").value) || 0);
    const n = Math.max(0, (Number($("years").value) || 0) * 12 + (Number($("months").value) || 0));
    const method = $("method").value;
    const tbody = $("schedule");

    if (principal <= 0 || n <= 0) {
      ["monthly", "count", "interest", "total"].forEach((id) => ($(id).textContent = "—"));
      $("detail").textContent = "借入金額と返済期間を入力してください。";
      tbody.innerHTML = "";
      return;
    }

    const rows = buildSchedule(principal, rate, n, method);
    const totalPaid = rows.reduce((s, r) => s + r.payment, 0);
    const totalInterest = rows.reduce((s, r) => s + r.interest, 0);
    const first = rows[0], last = rows[rows.length - 1];

    if (method === "annuity") {
      $("label").textContent = "毎月の返済額";
      $("monthly").textContent = yen(first.payment);
      $("detail").textContent = last.payment !== first.payment ? `最終回のみ ${yen(last.payment)}` : "";
    } else {
      $("label").textContent = "毎月の返済額（初回）";
      $("monthly").textContent = yen(first.payment);
      $("detail").textContent = `毎月減少し、最終回は ${yen(last.payment)}`;
    }
    $("count").textContent = n + " 回";
    $("interest").textContent = yen(totalInterest);
    $("total").textContent = yen(totalPaid);

    tbody.innerHTML = rows.map((r) =>
      `<tr><td>${r.i}</td><td>${r.payment.toLocaleString("ja-JP")}</td><td>${r.princ.toLocaleString("ja-JP")}</td><td>${r.interest.toLocaleString("ja-JP")}</td><td>${r.balance.toLocaleString("ja-JP")}</td></tr>`
    ).join("");
  }

  ["principal", "rate", "years", "months", "method"].forEach((id) => $(id).addEventListener("input", render));
  render();
</script>
</body>
</html>
